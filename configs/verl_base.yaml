# Overrides merged onto the exact upstream ppo_trainer configuration.
# All model, path and seed fields are set by math_rft.train.
trainer:
  use_v1: false
  nnodes: 1
  n_gpus_per_node: 8
  total_epochs: 3
  project_name: math_rft
  logger: [console, tensorboard]
  val_before_train: true
  test_freq: 20
  save_freq: 20
  resume_mode: disable
  default_hdfs_dir: null
  balance_batch: true
data:
  train_batch_size: 64
  max_prompt_length: 4096
  max_response_length: 4096
  shuffle: true
  validation_shuffle: false
  filter_overlong_prompts: false
  truncation: error
  dataloader_num_workers: 0
  return_raw_chat: true
  return_multi_modal_inputs: false
actor_rollout_ref:
  model:
    external_lib: math_rft.algorithms
    trust_remote_code: false
    use_remove_padding: false
    use_fused_kernels: false
    enable_gradient_checkpointing: true
    lora_rank: 0
    lora:
      rank: 0
    override_config:
      attn_implementation: sdpa
  actor:
    strategy: fsdp2
    ppo_mini_batch_size: 64
    ppo_micro_batch_size_per_gpu: 1
    ppo_infer_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: false
    ppo_epochs: 1
    shuffle: false
    entropy_coeff: 0.0
    calculate_entropy: true
    use_kl_loss: false
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    optim:
      lr: 0.000001
      weight_decay: 0.0
      lr_warmup_steps_ratio: 0.0
      lr_scheduler_type: constant
      betas: [0.9, 0.999]
      clip_grad: 1.0
    fsdp_config:
      strategy: fsdp2
      model_dtype: fp32
      dtype: bfloat16
      param_offload: false
      optimizer_offload: false
      use_torch_compile: false
      ulysses_sequence_parallel_size: 1
    checkpoint:
      save_contents: [model, optimizer, extra, hf_model]
      load_contents: [model, optimizer, extra]
  rollout:
    name: vllm
    dtype: bfloat16
    ignore_eos: false
    engine_kwargs:
      vllm:
        generation_config: vllm
    n: 8
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    do_sample: true
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.65
    max_model_len: 8192
    max_num_batched_tokens: 8192
    max_num_seqs: 256
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: false
    calculate_log_probs: true
    agent:
      default_agent_loop: raw_math
    val_kwargs:
      n: 16
      temperature: 1.0
      top_p: 1.0
      top_k: -1
      do_sample: true
algorithm:
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: true
  filter_groups:
    enable: false
  rollout_correction:
    rollout_is: null
    rollout_rs: null
    bypass_mode: false
critic:
  enable: false
reward:
  num_workers: 8
  reward_model:
    enable: false
  reward_manager:
    name: naive
  custom_reward_function:
    name: compute_score
